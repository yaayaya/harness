name: 功能提案
description: 為 Harness Codex 版提出新能力或改進
title: "[feat] "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        請先說明要解決的問題，再描述方案。若涉及新的架構模式、執行環境或破壞性介面，請附上遷移與驗證方式。

  - type: textarea
    id: problem
    attributes:
      label: 要解決的問題
      description: 請提供具體使用情境、目前痛點與受影響使用者。
      placeholder: |
        當我為 ___ 建立 Harness 時，必須手動 ___，因為目前 ___。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
      description: 說明要修改 Skill、代理人、Plugin、Marketplace、MCP、Hook 或其他層級，以及預期工作流程。
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 完成與驗證方式
      description: 列出可證明功能完成的產物、測試、Dry-run 與失敗情境。
    validations:
      required: true

  - type: textarea
    id: credentials
    attributes:
      label: 外部服務與憑證需求
      description: 若需要外部服務，列出端點、驗證方式、環境變數名稱、最小權限與測試資料；不得貼密鑰。若無請填「無」。
    validations:
      required: true

  - type: dropdown
    id: related-pattern
    attributes:
      label: 相關團隊架構模式
      options:
        - 與特定模式無關
        - Pipeline
        - Fan-out / Fan-in
        - Expert Pool
        - Producer-Reviewer
        - Supervisor
        - Hierarchical Delegation
        - 新模式（請在方案中說明）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補充資訊
      description: 可附參考資料、截圖或相關 issue。
    validations:
      required: false
