name: 錯誤回報
description: 回報 Harness Codex 外掛、技能、代理人產物或安裝流程的錯誤
title: "[bug] "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感謝你協助改善 Harness。送出前請先搜尋既有 issue，並移除 API Key、token、帳號與其他敏感資訊。

  - type: input
    id: codex-version
    attributes:
      label: Codex 版本
      description: 請貼上 `codex --version` 的輸出。
      placeholder: "codex x.y.z"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: 使用介面
      options:
        - ChatGPT 桌面版中的 Codex
        - Codex CLI
        - Codex IDE Extension
        - Codex Cloud
        - 其他
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Harness 安裝方式
      options:
        - 遠端 Marketplace
        - 本機 Marketplace
        - 直接安裝 Skill
        - 尚未安裝／不適用
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 重現步驟
      description: 請提供最小重現步驟、prompt、設定與必要檔案位置。
      placeholder: |
        1. 執行 `codex plugin marketplace add ...`
        2. 從 Plugins 安裝 Harness
        3. 輸入 `$harness ...`
        4. 觀察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 預期行為
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 實際行為
      description: 請附上已遮蔽敏感資訊的完整錯誤訊息。
    validations:
      required: true

  - type: textarea
    id: agent-config
    attributes:
      label: 代理人設定（如適用）
      description: 請貼上 `[agents]` 的 max_threads、max_depth 與相關自訂代理人名稱，不要貼密鑰。
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 作業系統
      options:
        - macOS
        - Linux
        - Windows（WSL）
        - Windows（原生）
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 補充資訊
      description: 可附日誌、截圖或最小重現儲存庫；請先遮蔽敏感資訊。
    validations:
      required: false
